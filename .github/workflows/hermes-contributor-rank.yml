name: Update Hermes contribution stats

on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-contributor-rank.yml'
      - 'scripts/update_hermes_contributions.py'
      - 'tests/test_hermes_contributions.py'

permissions:
  contents: write

concurrency:
  group: hermes-contribution-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Verify counting and pagination rules
        run: python3 -m unittest discover -s tests -v

      - name: Count authored and co-authored commits for every contributor
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/update_hermes_contributions.py

      - name: Publish verified statistics and badges together
        run: |
          git add data/hermes-contributions.json data/hermes-contributions.md data/hermes-commits.json data/hermes-contributor-rank.json
          if git diff --cached --quiet; then
            echo 'Contribution statistics unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh Hermes authored and co-authored statistics'
          git push
