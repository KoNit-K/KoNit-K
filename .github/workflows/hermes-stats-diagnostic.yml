name: Diagnose Hermes commit objects
on:
  workflow_dispatch:
    inputs:
      shas:
        description: Space-separated full commit SHAs (maximum 10)
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare GitHub commit lookup paths
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_SHAS: ${{ inputs.shas }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          shas = os.environ['DIAGNOSTIC_SHAS'].split()
          if not 1 <= len(shas) <= 10 or any(not re.fullmatch(r'[0-9a-fA-F]{40}', sha) for sha in shas):
              raise SystemExit('Provide between 1 and 10 full commit SHAs.')
          subprocess.run(['python3', 'scripts/update_hermes_contributions.py', '--diagnose-only', *shas], check=True)
          PY
